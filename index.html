<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscrição - nextech</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- CABEÇALHO -->
    <header class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-6 py-5">

            <h1 class="text-3xl font-bold">
                TechConnect
            </h1>

            <p class="text-blue-100 mt-1">
                Formulário de inscrição
            </p>

        </div>
    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-6xl mx-auto px-6 py-10">

        <!-- FORMULÁRIO -->
        <section class="bg-white rounded-xl shadow-md p-6 mb-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                Faça sua inscrição
            </h2>

            <form id="formulario">

                <!-- NOME -->
                <div class="mb-5">

                    <label for="nome" class="block text-gray-700 font-semibold mb-2">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome completo"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >

                </div>


                <!-- E-MAIL -->
                <div class="mb-5">

                    <label for="email" class="block text-gray-700 font-semibold mb-2">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >

                </div>


                <!-- WHATSAPP -->
                <div class="mb-6">

                    <label for="whatsapp" class="block text-gray-700 font-semibold mb-2">
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="whatsapp"
                        placeholder="(85) 99999-9999"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >

                </div>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition"
                >
                    Se inscreva
                </button>

            </form>

        </section>


        <!-- TABELA -->
        <section class="bg-white rounded-xl shadow-md p-6">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                Inscrições realizadas
            </h2>

            <div class="overflow-x-auto">

                <table class="w-full border-collapse">

                    <thead>

                        <tr class="bg-blue-600 text-white">

                            <th class="border px-4 py-3 text-left">
                                Nome completo
                            </th>

                            <th class="border px-4 py-3 text-left">
                                E-mail
                            </th>

                            <th class="border px-4 py-3 text-left">
                                WhatsApp
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tabelaInscricoes">

                        <!-- Os dados serão adicionados aqui -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer class="bg-gray-900 text-white text-center py-6">

        <p>
            © 2026 TechConnect - Sistema de inscrições
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script>

        // Pegando o formulário
        const formulario = document.getElementById("formulario");

        // Pegando o corpo da tabela
        const tabela = document.getElementById("tabelaInscricoes");


        // Evento executado quando o formulário for enviado
        formulario.addEventListener("submit", function(event) {

            // Impede a página de recarregar
            event.preventDefault();


            // Pegando os valores digitados
            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const whatsapp = document.getElementById("whatsapp").value;


            // Criando uma nova linha
            const novaLinha = document.createElement("tr");

            // Estilo da linha
            novaLinha.classList.add(
                "hover:bg-gray-100",
                "transition"
            );


            // Criando as células da tabela
            novaLinha.innerHTML = `

                <td class="border px-4 py-3">
                    ${nome}
                </td>

                <td class="border px-4 py-3">
                    ${email}
                </td>

                <td class="border px-4 py-3">
                    ${whatsapp}
                </td>

            `;


            // Adicionando a linha na tabela
            tabela.appendChild(novaLinha);


            // Limpando o formulário
            formulario.reset();

        });

    </script>

</body>
</html>
