<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marcas de Roupas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            min-height: 100vh;
        }

        /* CABEÇALHO */
        header {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .logo-site {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 8px;
            color: #ccc;
        }

        /* CONTAINER */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        /* PESQUISA */
        .pesquisa {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .pesquisa h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .campo {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            background-color: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        /* RESULTADO */
        #resultado {
            margin-top: 30px;
        }

        .marca {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .marca img {
            width: 220px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .marca h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .marca p {
            font-size: 18px;
            margin: 8px;
        }

        .erro {
            text-align: center;
            color: red;
            font-weight: bold;
        }

        /* RESPONSIVO */
        @media (max-width: 600px) {

            .campo {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

        }
    </style>
</head>

<body>

    <!-- CABEÇALHO -->
    <header>

        <div class="logo-site">
            MARCAS DE ROUPAS
        </div>

        <p>
            Pesquise uma marca e veja sua logo
        </p>

    </header>


    <!-- CONTEÚDO -->
    <main class="container">

        <section class="pesquisa">

            <h2>Pesquisar marca de roupa</h2>

            <div class="campo">

                <input
                    type="text"
                    id="marcaInput"
                    placeholder="Digite o nome da marca"
                >

                <button onclick="buscarMarca()">
                    Pesquisar
                </button>

            </div>


            <!-- RESULTADO -->
            <div id="resultado"></div>

        </section>

    </main>


    <script>

        /*
            BANCO DE MARCAS

            As informações abaixo representam os dados
            que serão apresentados quando a marca for pesquisada.
        */

        const marcas = {

            nike: {
                nome: "Nike",
                categoria: "Moda esportiva",
                logo: "https://upload.wikimedia.org/wikipedia/commons/a/a6/Logo_NIKE.svg"
            },

            adidas: {
                nome: "Adidas",
                categoria: "Moda esportiva",
                logo: "https://upload.wikimedia.org/wikipedia/commons/2/20/Adidas_Logo.svg"
            },

            puma: {
                nome: "Puma",
                categoria: "Moda esportiva",
                logo: "https://upload.wikimedia.org/wikipedia/commons/d/da/Puma_complete_logo.svg"
            },

            lacoste: {
                nome: "Lacoste",
                categoria: "Moda casual",
                logo: "https://upload.wikimedia.org/wikipedia/commons/8/88/Lacoste_logo.svg"
            },

            gucci: {
                nome: "Gucci",
                categoria: "Moda de luxo",
                logo: "https://upload.wikimedia.org/wikipedia/commons/7/79/1960s_Gucci_Logo.svg"
            }

        };


        // FUNÇÃO DE PESQUISA
        function buscarMarca() {

            // Pegando o texto digitado
            const texto = document
                .getElementById("marcaInput")
                .value
                .toLowerCase()
                .trim();

            const resultado =
                document.getElementById("resultado");


            // Verificando se o campo está vazio
            if (texto === "") {

                resultado.innerHTML = `
                    <p class="erro">
                        Digite o nome de uma marca.
                    </p>
                `;

                return;
            }


            // Procurando a marca
            const marca = marcas[texto];


            // Se não encontrar
            if (!marca) {

                resultado.innerHTML = `
                    <p class="erro">
                        Marca não encontrada.
                        <br><br>
                        Tente: Nike, Adidas, Puma,
                        Lacoste ou Gucci.
                    </p>
                `;

                return;
            }


            // Mostrando a marca
            resultado.innerHTML = `

                <div class="marca">

                    <img
                        src="${marca.logo}"
                        alt="Logo da ${marca.nome}"
                    >

                    <h2>
                        ${marca.nome}
                    </h2>

                    <p>
                        <strong>Categoria:</strong>
                        ${marca.categoria}
                    </p>

                    <p>
                        <strong>Tipo:</strong>
                        Marca de roupas
                    </p>

                </div>

            `;

        }

    </script>

</body>
</html>
